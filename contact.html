<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script>
    (function() {
      var t = localStorage.getItem('onetoolbox_theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Preconnect & Non-blocking Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"></noscript>
  <link rel="stylesheet" href="/assets/css/main.css">
  <title>Contact Us — OneToolBox | Support & Feedback</title>
  <meta name="description" content="Get in touch with the OneToolBox team for tool requests, feedback, bug reports, and community support.">
  <link rel="canonical" href="https://onetoolbox.dev/contact">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://onetoolbox.dev/contact">
  <meta property="og:title" content="Contact Us — OneToolBox | Support & Feedback">
  <meta property="og:description" content="Get in touch with the OneToolBox team for tool requests, feedback, bug reports, and community support.">
  <meta property="og:site_name" content="OneToolBox">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:url" content="https://onetoolbox.dev/contact">
  <meta name="twitter:title" content="Contact Us — OneToolBox | Support & Feedback">
  <meta name="twitter:description" content="Get in touch with the OneToolBox team for tool requests, feedback, bug reports, and community support.">

  <script type="application/ld+json">
  {
  "@context": "https://schema.org",
  "@type": "ContactPage",
  "name": "Contact Us \u2014 OneToolBox | Support & Feedback",
  "url": "https://onetoolbox.dev/contact.html",
  "description": "Get in touch with the OneToolBox team for tool requests, feedback, bug reports, and community support.",
  "publisher": {
    "@type": "Organization",
    "name": "OneToolBox",
    "url": "https://onetoolbox.dev"
  }
}
  </script>

</head>
<body>

  <!-- Site Header -->
  <header class="site-header">
    <div class="container">
      <div class="header-inner">
        <a href="/" class="brand-logo">
          <img src="/apple-touch-icon.png" alt="OneToolBox Logo" class="brand-img-logo" width="28" height="28">
          <span>OneToolBox</span>
        </a>

        <button class="header-search-btn trigger-search" aria-label="Search tools">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <span>Search tools...</span>
          <kbd>Ctrl K</kbd>
        </button>

        <nav>
          <ul class="nav-links">
            <li><a href="/categories/index.html" class="nav-link">Categories</a></li>
            <li><a href="/about.html" class="nav-link">About</a></li>
            <li><a href="/contact.html" class="nav-link active">Contact</a></li>
          </ul>
        </nav>

        <div class="header-actions">
          <button id="theme-toggle" class="icon-btn" aria-label="Toggle dark mode"></button>
          <button id="mobile-menu-btn" class="icon-btn mobile-menu-btn" aria-label="Toggle navigation menu">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
          </button>
        </div>
      </div>
    </div>
  </header>
  <!-- Mobile Drawer Nav -->
  <div id="mobile-nav" class="mobile-nav">
    <ul class="mobile-nav-list">
      <li><a href="/categories/index.html" class="mobile-nav-link">Categories</a></li>
      <li><a href="/about.html" class="mobile-nav-link">About Us</a></li>
      <li><a href="/contact.html" class="mobile-nav-link">Contact</a></li>
      <li><a href="/privacy.html" class="mobile-nav-link">Privacy Policy</a></li>
      <li><a href="/terms.html" class="mobile-nav-link">Terms of Service</a></li>
    </ul>
  </div>

  <main class="main-content container" style="padding-top: var(--space-10);">
    <div style="max-width: 640px; margin: 0 auto;">
      <h1 class="page-title">Contact Us</h1>
      <p class="page-subtitle" style="margin-bottom: var(--space-8);">
        Have a feature request, bug report, or tool idea? Send us a message below.
      </p>

      <form id="contact-form" class="tool-container" onsubmit="event.preventDefault(); OneToolBox.toast('Thank you! Your message has been received.'); this.reset();">
        <div class="form-group">
          <label for="name" class="form-label">Your Name</label>
          <input type="text" id="name" class="input-control" required placeholder="Alex Smith">
        </div>

        <div class="form-group">
          <label for="email" class="form-label">Email Address</label>
          <input type="email" id="email" class="input-control" required placeholder="alex@example.com">
        </div>

        <div class="form-group">
          <label for="subject" class="form-label">Subject / Tool Request</label>
          <input type="text" id="subject" class="input-control" required placeholder="New Tool Idea: SVG Optimizer">
        </div>

        <div class="form-group">
          <label for="message" class="form-label">Message</label>
          <textarea id="message" class="textarea-control" style="min-height: 120px;" required placeholder="Tell us how we can help..."></textarea>
        </div>

        <button type="submit" class="btn btn-primary btn-full">Send Message</button>
      </form>
    </div>
  </main>

  <!-- Search Modal -->
  <div id="search-modal-backdrop" class="search-modal-backdrop">
    <div class="search-modal">
      <div class="search-input-header">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-muted"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" id="search-modal-input" placeholder="Type a tool name or keyword..." autocomplete="off">
        <kbd>ESC</kbd>
      </div>
      <ul id="search-results-list" class="search-results-list"></ul>
    </div>
  </div>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom" style="border: none; padding: 0;">
        <span>&copy; 2026 OneToolBox. All rights reserved.</span>
        <a href="/" class="section-link">&larr; Back to Homepage</a>
      </div>
    </div>
  </footer>

  <script src="/assets/js/main.min.js"></script>
</body>
</html>
